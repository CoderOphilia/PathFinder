spring.application.name=PathFinder
#server.port=8082
#server.servlet.context-path=/services

# Disable Thymeleaf caching for fast frontend iteration
spring.thymeleaf.cache=false

# Disable static resource caching in dev
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.cache.cachecontrol.no-store=true

# Enable LiveReload
spring.devtools.livereload.enabled=true

# Enable the H2 console for local debugging.
spring.h2.console.enabled=true

# Use a workspace-local H2 database during development so schema updates
# don't depend on older files under the user home directory.
#spring.datasource.url=jdbc:h2:file:~/my_db
spring.datasource.url=jdbc:h2:file:./pathfinder_dev_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tell Hibernate exactly which database dialect to use.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Developer quick switch dock (on by default; off for prod profiles unless explicitly allowed).
pathfinder.dev-navbar.enabled=true
pathfinder.dev-navbar.allow-in-production=false

