<aside xmlns:th="http://www.thymeleaf.org" th:fragment="navbar" class="devDock" aria-label="Quick switch">
	<details class="devDock__panel">
		<summary class="devDock__toggle" aria-label="Open quick switcher">
			<span class="devDock__toggleLabel">Switch</span>
			<span
				class="devDock__current"
				th:text="${#strings.startsWith(currentUrl, '/mentee') || #strings.startsWith(currentUrl, '/seeker') ? 'Mentee' : (#strings.startsWith(currentUrl, '/mentor') ? 'Mentor' : (#strings.startsWith(currentUrl, '/admin') ? 'Admin' : (#strings.startsWith(currentUrl, '/auth') ? 'Auth' : 'Public')))}"
			>Public</span>
		</summary>

		<div class="devDock__content">
			<section class="devDock__section" aria-label="Spaces">
				<p class="devDock__sectionTitle">Spaces</p>
				<nav class="devDock__links devDock__links--spaces" aria-label="Space shortcuts">
					<a th:href="@{/}" class="devDock__link" th:classappend="${currentUrl == '/' || #strings.startsWith(currentUrl, '/mentors') ? 'active' : ''}" th:attr="aria-current=${currentUrl == '/' || #strings.startsWith(currentUrl, '/mentors')} ? 'page' : null" aria-label="Public site">Public</a>
					<a th:href="@{/mentee/home}" class="devDock__link" th:classappend="${#strings.startsWith(currentUrl, '/mentee') || #strings.startsWith(currentUrl, '/seeker') ? 'active' : ''}" th:attr="aria-current=${#strings.startsWith(currentUrl, '/mentee') || #strings.startsWith(currentUrl, '/seeker')} ? 'page' : null" aria-label="Mentee workspace">Mentee</a>
					<a th:href="@{/mentor/home}" class="devDock__link" th:classappend="${#strings.startsWith(currentUrl, '/mentor') ? 'active' : ''}" th:attr="aria-current=${#strings.startsWith(currentUrl, '/mentor')} ? 'page' : null" aria-label="Mentor workspace">Mentor</a>
					<a th:href="@{/admin/home}" class="devDock__link" th:classappend="${#strings.startsWith(currentUrl, '/admin') ? 'active' : ''}" th:attr="aria-current=${#strings.startsWith(currentUrl, '/admin')} ? 'page' : null" aria-label="Admin workspace">Admin</a>
				</nav>
			</section>

			<section class="devDock__section" aria-label="Actions">
				<p class="devDock__sectionTitle">Actions</p>
				<nav class="devDock__links devDock__links--actions" aria-label="Action shortcuts">
					<a th:href="@{/auth/login}" class="devDock__link" th:classappend="${currentUrl == '/auth/login' ? 'active' : ''}" th:attr="aria-current=${currentUrl == '/auth/login'} ? 'page' : null" aria-label="Sign in">Sign in</a>
					<a th:href="@{/auth/signup}" class="devDock__link" th:classappend="${currentUrl == '/auth/signup' ? 'active' : ''}" th:attr="aria-current=${currentUrl == '/auth/signup'} ? 'page' : null" aria-label="Create account">Sign up</a>
					<a th:href="@{/mentee/sessions/new}" class="devDock__link" th:classappend="${#strings.startsWith(currentUrl, '/mentee/sessions') || #strings.startsWith(currentUrl, '/seeker/sessions') ? 'active' : ''}" th:attr="aria-current=${#strings.startsWith(currentUrl, '/mentee/sessions') || #strings.startsWith(currentUrl, '/seeker/sessions')} ? 'page' : null" aria-label="Start a session request">Session</a>
					<a th:href="@{/mentor/requests}" class="devDock__link" th:classappend="${#strings.startsWith(currentUrl, '/mentor/requests') || #strings.startsWith(currentUrl, '/mentor/sessions') ? 'active' : ''}" th:attr="aria-current=${#strings.startsWith(currentUrl, '/mentor/requests') || #strings.startsWith(currentUrl, '/mentor/sessions')} ? 'page' : null" aria-label="View mentor requests">Requests</a>
					<a th:href="@{/admin/mentors/review}" class="devDock__link" th:classappend="${#strings.startsWith(currentUrl, '/admin/mentors/review') ? 'active' : ''}" th:attr="aria-current=${#strings.startsWith(currentUrl, '/admin/mentors/review')} ? 'page' : null" aria-label="Open mentor review queue">Review</a>
				</nav>
			</section>
		</div>
	</details>
</aside>
