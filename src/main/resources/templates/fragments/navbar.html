<nav xmlns:th="http://www.thymeleaf.org" th:fragment="navbar" class="nav">
    <a th:href="@{/}" class="nav__brand" aria-label="PathFinder home">
        <span>📍</span> PathFinder
    </a>

    <div class="nav__links" aria-label="Primary navigation">
        <a th:href="@{/}" class="nav__link" th:classappend="${currentUrl == '/' ? 'active' : ''}"
           th:attr="aria-current=${currentUrl == '/'} ? 'page' : null">Home</a>
        <a th:href="@{/#how-it-works}" class="nav__link">How it works</a>
        <a th:href="@{/auth/login}" class="nav__link"
           th:classappend="${#strings.startsWith(currentUrl, '/auth') ? 'active' : ''}"
           th:attr="aria-current=${#strings.startsWith(currentUrl, '/auth')} ? 'page' : null">Sign in</a>
        <a th:href="@{/auth/signup}" class="nav__link nav__cta"
           th:classappend="${currentUrl == '/auth/signup' ? 'active' : ''}"
           th:attr="aria-current=${currentUrl == '/auth/signup'} ? 'page' : null">Create account</a>
    </div>

    <!-- Mobile Nav (Fixed Bottom) -->
    <div class="nav__links--mobile" aria-label="Primary mobile navigation">
        <a th:href="@{/}" class="nav__link nav__link--icon" th:classappend="${currentUrl == '/' ? 'active' : ''}"
           th:attr="aria-current=${currentUrl == '/'} ? 'page' : null" aria-label="Home">🏠</a>
        <a th:href="@{/mentee/home}" class="nav__link nav__link--icon"
           th:classappend="${#strings.startsWith(currentUrl, '/mentee') || #strings.startsWith(currentUrl, '/seeker') ? 'active' : ''}"
           th:attr="aria-current=${#strings.startsWith(currentUrl, '/mentee') || #strings.startsWith(currentUrl, '/seeker')} ? 'page' : null"
           aria-label="Mentee home">👤</a>
        <a th:href="@{/mentor/home}" class="nav__link nav__link--icon"
           th:classappend="${#strings.startsWith(currentUrl, '/mentor') ? 'active' : ''}"
           th:attr="aria-current=${#strings.startsWith(currentUrl, '/mentor')} ? 'page' : null"
           aria-label="Mentor home">🎓</a>
        <a th:href="@{/auth/login}" class="nav__link nav__link--icon"
           th:classappend="${#strings.startsWith(currentUrl, '/auth') ? 'active' : ''}"
           th:attr="aria-current=${#strings.startsWith(currentUrl, '/auth')} ? 'page' : null" aria-label="Sign in">🔑</a>
    </div>
</nav>
