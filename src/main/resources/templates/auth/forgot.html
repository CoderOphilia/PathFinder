<section xmlns:th="http://www.thymeleaf.org" th:fragment="content">
	<div class="gridPage">
		<section class="tile tile--aside" aria-label="PathFinder onboarding details">
			<th:block th:replace="~{fragments/auth_aside :: aside}"></th:block>
		</section>

		<section class="tile tile--form" aria-label="Reset password">
			<p class="tile__kicker">Account recovery</p>
			<h1>Reset your password</h1>
			<p class="p p--muted p--tight">
				Enter your email and we will simulate sending a reset link.
			</p>

			<p th:if="${formError}" class="notice notice--error" role="alert" th:text="${formError}">Form error</p>
			<p th:if="${flashMessage}" class="notice notice--success" role="status" th:text="${flashMessage}">Success</p>

			<form method="post" th:action="@{/auth/forgot}">
				<div>
					<label for="email" class="label label--required">Email</label>
					<input id="email" class="input" name="email" type="email" autocomplete="email" required />
				</div>

				<button type="submit" class="btn btn--default">Send reset link</button>
			</form>

			<p class="p">
				<a th:href="@{/auth/login}" class="link link--underline">Back to login</a>
			</p>
			<p class="p p--sm p--muted p--tight">If you do not see an email, check your spam folder.</p>
		</section>
	</div>
</section>
