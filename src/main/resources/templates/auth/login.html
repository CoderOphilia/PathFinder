<section xmlns:th="http://www.thymeleaf.org" th:fragment="content">
	<div class="gridPage">
		<section class="tile tile--aside" aria-label="PathFinder onboarding details">
			<th:block th:replace="~{fragments/auth_aside :: aside}"></th:block>
		</section>

		<section class="tile tile--form" aria-label="Sign in">
			<p class="tile__kicker">Welcome back</p>
			<h1>Sign in to PathFinder</h1>
			<p class="p p--muted p--tight">
				Sign in with the email and password you used when creating your account.
			</p>

			<p th:if="${formError}" class="notice notice--error" role="alert" th:text="${formError}">Form error</p>
			<p th:if="${flashMessage}" class="notice notice--success" role="status" th:text="${flashMessage}">Success</p>

			<form method="post" th:action="@{/auth/login}">
				<div>
					<label for="email" class="label label--required">Email</label>
					<input
						id="email"
						class="input"
						name="email"
						type="email"
						autocomplete="email"
						required
					/>
				</div>

				<div>
					<label for="password" class="label label--required">Password</label>
					<input
						id="password"
						class="input"
						name="password"
						type="password"
						autocomplete="current-password"
						required
					/>
				</div>

				<p class="p p--sm p--muted p--tight">
					<a th:href="@{/auth/forgot}" class="link link--muted link--underline">Forgot password?</a>
				</p>

				<button type="submit" class="btn btn--default">Sign in</button>
			</form>

			<p class="p">
				New to PathFinder?
				<a th:href="@{/auth/signup}" class="link link--underline">Create an account</a>
			</p>
		</section>
	</div>
</section>
