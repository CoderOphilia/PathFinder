<section xmlns:th="http://www.thymeleaf.org" th:fragment="content">
	<div class="gridPage">
		<section class="tile tile--full">
			<p class="tile__kicker">Admin moderation</p>
			<h1>Users</h1>
			<p class="p p--muted p--tight">
				Suspend active users or reactivate suspended users.
			</p>

			<p th:if="${formError}" class="notice notice--error" role="alert" th:text="${formError}">Error</p>
			<p th:if="${flashMessage}" class="notice notice--success" role="status" th:text="${flashMessage}">Success</p>
		</section>

		<section class="tile tile--full">
			<div class="tableWrap">
				<table class="dataTable">
					<thead>
						<tr>
							<th scope="col">Name</th>
							<th scope="col">Email</th>
							<th scope="col">Role</th>
							<th scope="col">Status</th>
							<th scope="col">Action</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="user : ${managedUsers}">
							<td th:text="${user.fullName}">User Name</td>
							<td th:text="${user.email}">user@example.com</td>
							<td th:text="${user.role}">Mentee</td>
							<td th:text="${user.accountStatus}">ACTIVE</td>
							<td>
								<form th:if="${user.canSuspend}" method="post" th:action="@{|/admin/users/${user.userId}/suspend|}">
									<button type="submit" class="btn btn--outline">Suspend</button>
								</form>
								<form th:if="${user.canReactivate}" method="post" th:action="@{|/admin/users/${user.userId}/reactivate|}">
									<button type="submit" class="btn btn--default">Reactivate</button>
								</form>
								<span th:if="${!user.canSuspend and !user.canReactivate}" class="p p--sm p--muted">No action</span>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</section>
