<section xmlns:th="http://www.thymeleaf.org" th:fragment="content">
	<div class="gridPage">
		<section class="tile tile--full">
			<p class="tile__kicker">Admin oversight</p>
			<h1>Sessions</h1>
			<p class="p p--muted p--tight">
				View all saved session requests and cancel active ones if needed.
			</p>

			<p th:if="${formError}" class="notice notice--error" role="alert" th:text="${formError}">Error</p>
			<p th:if="${flashMessage}" class="notice notice--success" role="status" th:text="${flashMessage}">Success</p>
		</section>

		<section class="tile tile--full">
			<div class="tableWrap">
				<table class="dataTable">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Mentor</th>
							<th scope="col">Mentee</th>
							<th scope="col">Slot</th>
							<th scope="col">Type</th>
							<th scope="col">Status</th>
							<th scope="col">Payment</th>
							<th scope="col">Submitted</th>
							<th scope="col">Action</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="item : ${sessionItems}">
							<td th:text="${item.requestId}">1</td>
							<td th:text="${item.mentorName}">Mentor</td>
							<td th:text="${item.menteeEmail}">mentee@example.com</td>
							<td th:text="${item.slotLabel}">Thu • 6:00 PM</td>
							<td th:text="${item.sessionType}">Mock interview</td>
							<td><span th:class="${item.statusClass}" th:text="${item.statusLabel}">Requested</span></td>
							<td><span th:class="${item.paymentStatusClass}" th:text="${item.paymentStatusLabel}">Not paid</span></td>
							<td th:text="${item.submittedAtLabel}">Mon, Apr 7 • 2:00 PM</td>
							<td>
								<form th:if="${item.canCancel}" method="post" th:action="@{|/admin/sessions/${item.requestId}/cancel|}">
									<button type="submit" class="btn btn--outline">Cancel</button>
								</form>
								<span th:if="${!item.canCancel}" class="p p--sm p--muted">No action</span>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</section>
