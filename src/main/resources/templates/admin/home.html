<section xmlns:th="http://www.thymeleaf.org" th:fragment="content">
	<div class="gridPage">
		<section class="tile tile--full tile--admin">
			<p class="tile__kicker">Admin workspace</p>
			<h1>Admin home</h1>
			<p class="p p--muted p--tight">
				Simple admin tools for mentor review, user moderation, and session oversight.
			</p>
			<div class="heroActions">
				<a class="btn btn--default" th:href="@{/admin/mentors/review}">Mentor review</a>
				<a class="btn btn--outline" th:href="@{/admin/users}">Users</a>
				<a class="btn btn--outline" th:href="@{/admin/sessions}">Sessions</a>
				<a class="btn btn--outline" th:href="@{/admin/profile}">Profile</a>
			</div>
		</section>

		<section class="tile tile--full">
			<div class="dashboardStats" aria-label="Admin stats">
				<article class="statCard">
					<h2 th:text="${pendingMentorReviewCount}">0</h2>
					<p class="p p--sm p--muted p--tight">Mentors pending review</p>
				</article>
				<article class="statCard">
					<h2 th:text="${managedUserCount}">0</h2>
					<p class="p p--sm p--muted p--tight">Users in the system</p>
				</article>
				<article class="statCard">
					<h2 th:text="${activeSessionCount}">0</h2>
					<p class="p p--sm p--muted p--tight">Sessions that can still be cancelled</p>
				</article>
			</div>
		</section>
	</div>
</section>
