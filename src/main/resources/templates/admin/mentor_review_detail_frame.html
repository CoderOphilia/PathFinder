<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title th:text="${selectedMentor.name + ' | Review details'}">Review details</title>
		<link rel="stylesheet" th:href="@{/css/app.css}" />
	</head>
	<body class="reviewFrameBody">
		<main class="reviewFrameMain">
			<section class="reviewFrameCard" aria-label="Selected mentor details">
				<h2 th:text="${selectedMentor.name}">Mentor Name</h2>
				<p class="p p--strong p--tight" th:text="${selectedMentor.roleAtCompany}">Title @ Company</p>
				<p class="p p--sm p--muted p--tight" th:text="${'Industry: ' + selectedMentor.industry}">Industry: Technology</p>
				<p class="p p--tight" th:text="${selectedMentor.tagline}">Profile summary</p>

				<dl class="detailList">
					<div>
						<dt>Review status</dt>
						<dd th:text="${selectedReviewItem.reviewStatus}">Pending review</dd>
					</div>
					<div>
						<dt>Admin note</dt>
						<dd th:text="${selectedReviewItem.adminNote != null and !selectedReviewItem.adminNote.isEmpty() ? selectedReviewItem.adminNote : 'No admin note yet.'}">
							No admin note yet.
						</dd>
					</div>
				</dl>

				<p class="tile__kicker">Skills</p>
				<ul class="tags tags--compact">
					<li class="tag" th:each="skill : ${selectedMentor.skills}" th:text="${skill}">Skill</li>
				</ul>

				<p class="tile__kicker">Interviewed at</p>
				<ul class="tags tags--compact">
					<li class="tag tag--soft" th:each="company : ${selectedMentor.interviewCompanies}" th:text="${company}">
						Company
					</li>
				</ul>

				<form
					method="post"
					target="_top"
					th:action="@{|/admin/mentors/review/${selectedMentor.slug}/approve|}"
					class="queueDecisionForm"
				>
					<div>
						<label for="adminNote" class="label">Admin note</label>
						<textarea
							id="adminNote"
							name="adminNote"
							class="textarea"
							rows="4"
							placeholder="Optional note for approval or requested changes."
							th:text="${selectedReviewItem.adminNote}"
						></textarea>
					</div>
					<div class="formActions">
						<button type="submit" class="btn btn--default">Approve mentor</button>
						<button
							type="submit"
							class="btn btn--outline"
							th:formaction="@{|/admin/mentors/review/${selectedMentor.slug}/request-updates|}"
						>
							Request changes
						</button>
					</div>
				</form>
			</section>
		</main>
	</body>
</html>
